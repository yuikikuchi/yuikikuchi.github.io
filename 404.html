<style>
  /* このページだけの組み。色と書体は style.css のものを使う */
  .lost { min-height: 100vh; min-height: 100svh; display: grid; align-content: center; gap: 22px; padding: 48px clamp(20px, 7vw, 120px); }
  .lost .lost__code { color: var(--ink); font-family: var(--f-disp); font-stretch: 125%; font-weight: 800; font-size: clamp(88px, 24vw, 300px); line-height: .84; letter-spacing: -.03em; margin-left: -.04em; }
  .lost svg { width: min(100%, 760px); height: auto; overflow: visible; }
  .lost svg path { fill: none; stroke-linecap: round; }
  .lost .edge { stroke: var(--wire-edge); stroke-width: 9; }
  .lost .on { stroke: var(--w-guard); stroke-width: 5.6; }
  .lost .off { stroke: var(--wire-off); stroke-width: 5.6; }
  .lost .spark { stroke: var(--ink); stroke-width: 2; }
  .lost h1 { font-size: clamp(24px, 3.4vw, 42px); font-weight: 900; line-height: 1.4; }
  .lost p { max-width: 36em; color: var(--ink-2); }
</style>
</head>

<main class="lost">
  <p class="label">ERROR ／ OPEN CIRCUIT</p>
  <p class="lost__code" aria-hidden="true">404</p>
  <svg viewBox="0 0 760 44" aria-hidden="true">
    <path class="edge" d="M6 22H330"/><path class="on" d="M6 22H330"/>
